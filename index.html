function calc(){const a=data.assumptions,n=data.trip.adults,hotel=a.hotel_room_total_jpy/n,train=2*a.shinkansen_budget_one_way_jpy,local=a.local_rail_budget_jpy_per_person,travel=train+local;return{train,local,hotel,travel,total:travel+hotel,group:(travel+hotel)*n};}

}
const fields=[['hotel_room_total_jpy','宿の1室合計（円）',0,1000],['local_rail_budget_jpy_per_person','都内交通・1人（円）',0,100]];
function renderFields(){el('fields').innerHTML=fields.map(([key,label,min,step])=>`<label>${label}<input type="number" data-key="${key}" min="${min}" step="${step}" value="${data.assumptions[key]??''}" placeholder="未確定・合計に含めない" inputmode="decimal"></label>`).join('');el('fields').querySelectorAll('input').forEach(input=>input.addEventListener('input',()=>{const val=Number(input.value);if(input.value===''||!Number.isFinite(val)||val<Number(input.min)){el('error').textContent='0以上の金額を入力してください。';return;}data.assumptions[input.dataset.key]=val;el('error').textContent='';render();}));}
